name: frelease-ci
on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Contract syntax and deterministic tests
        run: |
          python -m py_compile contracts/*.py
          pytest -q tests/unit
      - name: GenVM lint
        run: |
          genvm-lint check contracts/frelease_registry.py
          genvm-lint check contracts/frelease_evaluator.py
      - name: Direct Mode
        run: pytest -q tests/direct
      - name: Release architecture guard
        run: python scripts/release_check.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend install
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Frontend typecheck
        working-directory: web
        run: npm run typecheck
      - name: Frontend lifecycle tests
        working-directory: web
        run: npm run test:lifecycle
      - name: Frontend production build
        working-directory: web
        run: npm run build
